[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1ml"
version = "0.1.0"
description = "F1 race & strategy modelling stack (phase 1: data foundation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "duckdb>=1.0",
    "pydantic>=2.5",
    "pyyaml>=6",
    "typer>=0.12",
    "requests>=2.31",
    "scipy>=1.11",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
f1ml = "f1ml.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
