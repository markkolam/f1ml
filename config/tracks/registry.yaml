# Track registry. A track is identified by a stable `id`; `aliases` are the
# Location strings that the timing data's event schedule uses for it.
# Locations not listed here get an auto-generated id (slugified Location) and
# are reported by `f1ml tracks-check` so they can be added.
#
# `versions` record layout or surface changes. Each lap is tagged with the
# version in force, so models can pool across versions of the same circuit
# while still letting a resurface or a new chicane shift the parameters.
#
# Measured quantities (pit loss, overtaking threshold, SC hazard, window %)
# are NOT hand-entered here: they are estimated from data in later phases.

tracks:
  - id: albert_park
    aliases: [Melbourne]
    versions:
      - {from_season: 2022, label: "2022 revised layout (T9-10 chicane removed, track widened)"}
  - id: yas_marina
    aliases: [Yas Island, Yas Marina, Abu Dhabi]
    versions:
      - {from_season: 2021, label: "2021 revised layout"}
